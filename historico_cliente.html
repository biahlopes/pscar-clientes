<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lançar Histórico - PsCar</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#f5f7fb; --card:#fff; --text:#243044; --muted:#718096;
  --border:#e6eaf0; --primary:#6c63ff; --primary2:#8179ff;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
.hidden{display:none !important}
.app{max-width:900px;margin:auto;padding:24px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:12px}
h1{margin:0;font-size:26px}
.subtitle{color:var(--muted);margin-top:5px;font-size:14px}
.header-actions{display:flex;align-items:center;gap:10px}
.user-pill{font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--border);padding:7px 12px;border-radius:999px}
.ghost{background:#f0f2f5;color:#475569;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}
.panel{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;margin-bottom:24px;box-shadow:0 4px 12px #26334d0a}
.panel h2{margin:0 0 16px;font-size:17px}
label{display:block;font-size:13px;font-weight:700;margin:13px 0 6px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid #dfe4ec;border-radius:10px;font:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px #6c63ff15}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.services{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:6px}
.service-item{display:flex;align-items:center;gap:8px;background:#f7f8fb;border:1px solid var(--border);border-radius:10px;padding:9px 11px;font-size:13px}
.service-item input{width:auto}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
button{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer}
.primary{background:var(--primary);color:#fff;box-shadow:0 5px 14px #6c63ff25;width:100%;margin-top:18px}
.primary:hover{background:var(--primary2)}
.list-item{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;background:#fafbfd}
.list-item .top{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px}
.list-item .cliente{font-weight:800}
.list-item .meta{font-size:12px;color:var(--muted)}
.list-item .servicos{margin-top:8px;font-size:13px}
.badge{display:inline-block;background:#eef2ff;color:#4b4bb0;padding:3px 9px;border-radius:999px;font-size:12px;margin:3px 4px 0 0}
.empty{border:1px dashed #cfd6e1;border-radius:12px;padding:25px 10px;text-align:center;color:#8b96a7;font-size:13px}
.delete-link{background:none;border:0;color:#b94444;font-size:12px;font-weight:700;padding:0;cursor:pointer}
.error-text{color:#b94444;font-size:13px;margin-top:10px;min-height:16px}
.carro-info{background:#eafaf1;border:1px solid #cdeedb;border-radius:10px;padding:12px 14px;font-size:13px;margin-top:8px;color:#1f6b46}
/* Login */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:#fff;width:min(380px,100%);border-radius:18px;padding:30px;box-shadow:0 20px 60px #11182720;text-align:center}
.login-card h1{font-size:22px;margin:0 0 6px}
.login-card p{color:var(--muted);font-size:14px;margin:0 0 20px}
.login-card label{text-align:left}
.login-card button{width:100%;margin-top:18px}
@media(max-width:700px){
  .row, .services{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <h1>Lançar Histórico</h1>
    <p>Entre com o acesso da equipe.</p>
    <form id="loginForm">
      <label for="loginEmail">E-mail</label>
      <input id="loginEmail" type="email" required placeholder="equipe@pscar.com" autocomplete="username">
      <label for="loginPassword">Senha</label>
      <input id="loginPassword" type="password" required placeholder="Senha da equipe" autocomplete="current-password">
      <div class="error-text" id="loginError"></div>
      <button type="submit" class="primary">Entrar</button>
    </form>
  </div>
</div>

<div class="app hidden" id="appScreen">
  <header>
    <div>
      <h1>Lançar histórico do cliente</h1>
      <div class="subtitle">Registre o que foi feito no carro para aparecer depois no portal do cliente.</div>
    </div>
    <div class="header-actions">
      <span class="user-pill" id="userPill"></span>
      <button class="ghost" onclick="logout()">Sair</button>
    </div>
  </header>

  <div class="panel">
    <h2>Novo lançamento</h2>
    <form id="form">
      <input type="hidden" id="registroId">
      <input type="hidden" id="carroId">

      <label for="placa">Placa do carro</label>
      <input id="placa" required placeholder="Ex.: ABC1D23" autocomplete="off">
      <div class="error-text" id="placaError"></div>
      <div class="carro-info hidden" id="carroInfo"></div>

      <div class="row">
        <div>
          <label for="data">Data do serviço</label>
          <input id="data" type="date" required>
        </div>
        <div>
          <label for="km">Quilometragem</label>
          <input id="km" type="number" required placeholder="Ex.: 47000">
        </div>
      </div>

      <label>Serviços realizados</label>
      <div class="services" id="servicesList"></div>
      <div class="hint">Lista com os serviços mais executados na oficina.</div>

      <label for="outros">Outro serviço (se não estiver na lista acima)</label>
      <textarea id="outros" rows="2" placeholder="Descreva aqui, se necessário"></textarea>

      <label for="observacao">Observação (o cliente vê isso no histórico dele)</label>
      <textarea id="observacao" rows="2" placeholder="Ex.: Recomendado trocar amortecedor na próxima visita"></textarea>

      <div class="error-text" id="formError"></div>

      <button type="submit" class="primary" id="submitBtn">Salvar lançamento</button>
      <button type="button" class="primary" id="cancelEditBtn" style="display:none;background:#f0f2f5;color:#475569;box-shadow:none" onclick="cancelarEdicao()">Cancelar edição</button>
    </form>
  </div>

  <div class="panel">
    <h2>Lançamentos registrados</h2>
    <div id="lista"></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://lwogclipyejxqaqeyzjc.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_i1pD6RijFsBdTPgSGKxM5w_L1OvJPZF";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let registros = [];
let realtimeChannel = null;
let carroEncontradoPlaca = null;

const SERVICOS_PADRAO = [
  "Troca de óleo",
  "Troca de filtro de óleo",
  "Filtro de combustível",
  "Filtro de ar",
  "Filtro de cabine",
  "Higienização do ar condicionado",
  "Troca de bomba de água",
  "Troca de kit correia dentada",
  "Troca de válvula termostática",
  "Troca de amortecedores e kit dianteiro",
  "Troca de amortecedores e kit traseiro",
  "Troca de cabo",
  "Troca de vela",
  "Troca de fluido de freio",
  "Troca de jogo de disco",
  "Limpeza de arrefecimento",
  "Troca de reservatório de água",
  "Troca de radiador",
  "Troca de coxim do motor",
  "Troca de coxim do câmbio",
  "Troca de rolamento",
  "Troca de cubo",
  "Troca de cabo de embreagem",
  "Troca de kit de embreagem",
  "Troca de jogo de sapata",
  "Limpeza e regulagem do freio traseiro",
  "Braço axial",
  "Bucha da barra de direção",
  "Caixa de direção",
  "Reparo caixa de direção",
  "Terminal de direção",
  "Mola",
  "Bandeja",
  "Bandeja com pivô",
  "Bieleta",
  "Coifa homocinética",
  "Coifa câmbio",
  "Trizeta",
  "Interruptor de óleo",
  "Bomba de óleo",
  "Pastilha",
  "Disco",
  "Limpeza de bico",
  "Limpeza de TBI"
];

// Regras de previsão da próxima manutenção (km e/ou meses). Itens fora daqui não têm previsão automática.
const REGRAS_PREVISAO = {
  "Troca de óleo": { km: 10000, meses: 6 },
  "Troca de filtro de óleo": { km: 10000, meses: 6 },
  "Filtro de combustível": { km: 10000, meses: 12 },
  "Filtro de ar": { km: 10000, meses: 12 },
  "Filtro de cabine": { km: 10000, meses: 12 },
  "Higienização do ar condicionado": { km: 10000, meses: 12 },
  "Troca de bomba de água": { km: 50000, meses: null },
  "Troca de kit correia dentada": { km: 50000, meses: null },
  "Troca de vela": { km: 20000, meses: 6 },
  "Troca de cabo": { km: 20000, meses: 6 },
  "Troca de fluido de freio": { km: 20000, meses: 6 },
  "Limpeza de bico": { km: null, meses: 6 },
  "Limpeza de TBI": { km: null, meses: 6 }
};

function calcularPrevisao(dataServico, kmServico, meses){
  let proximaData = null;
  if(meses){
    const d = new Date(dataServico + "T00:00:00");
    d.setMonth(d.getMonth() + meses);
    proximaData = d.toISOString().slice(0, 10);
  }
  return proximaData;
}

async function atualizarPrevisoes(carroId, servicosMarcados, dataServico, kmServico){
  const linhas = [];
  servicosMarcados.forEach(servico => {
    const regra = REGRAS_PREVISAO[servico];
    if(!regra) return;
    linhas.push({
      carro_id: carroId,
      servico: servico,
      proxima_data: calcularPrevisao(dataServico, kmServico, regra.meses),
      proxima_km: regra.km ? Number(kmServico) + regra.km : null,
      atualizado_em: new Date().toISOString()
    });
  });
  if(!linhas.length) return;

  const { error } = await supabaseClient
    .from("previsoes")
    .upsert(linhas, { onConflict: "carro_id,servico" });

  if(error) console.error("Erro ao salvar previsões:", error);
}

const $ = id => document.getElementById(id);

function renderServiceOptions(){
  $("servicesList").innerHTML = SERVICOS_PADRAO.map((s, i) => `
    <label class="service-item">
      <input type="checkbox" value="${escapeHtml(s)}" id="serv_${i}">
      ${escapeHtml(s)}
    </label>
  `).join("");
}

// ---------- Autenticação ----------
async function initAuth(){
  const { data: { session } } = await supabaseClient.auth.getSession();
  if(session){
    await enterApp(session);
  }else{
    showLogin();
  }
  supabaseClient.auth.onAuthStateChange((event) => {
    if(event === "SIGNED_OUT") showLogin();
  });
}

function showLogin(){
  $("loginScreen").classList.remove("hidden");
  $("appScreen").classList.add("hidden");
  if(realtimeChannel){
    supabaseClient.removeChannel(realtimeChannel);
    realtimeChannel = null;
  }
}

async function enterApp(session){
  $("loginScreen").classList.add("hidden");
  $("appScreen").classList.remove("hidden");
  $("userPill").textContent = session.user.email;
  await loadRegistros();
  subscribeRealtime();
}

$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("loginError").textContent = "";
  const email = $("loginEmail").value.trim();
  const password = $("loginPassword").value;
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if(error){
    $("loginError").textContent = "Não foi possível entrar. Confira o e-mail e a senha.";
    return;
  }
  await enterApp(data.session);
});

async function logout(){
  await supabaseClient.auth.signOut();
}

// ---------- Busca do carro pela placa ----------
async function buscarCarroPorPlaca(){
  const placa = $("placa").value.trim().toUpperCase();
  $("placaError").textContent = "";
  $("carroInfo").classList.add("hidden");
  $("carroId").value = "";
  carroEncontradoPlaca = null;

  if(!placa) return;

  const { data, error } = await supabaseClient
    .from("carros")
    .select("id, modelo, placa, clientes(nome, cpf)")
    .eq("placa", placa)
    .maybeSingle();

  if(error || !data){
    $("placaError").textContent = "Carro não encontrado. Cadastre o cliente e o carro primeiro em Cadastro de Clientes.";
    return;
  }

  $("carroId").value = data.id;
  carroEncontradoPlaca = placa;
  $("carroInfo").classList.remove("hidden");
  $("carroInfo").textContent = `${data.clientes.nome} (CPF ${data.clientes.cpf}) — ${data.modelo}`;
}

$("placa").addEventListener("blur", buscarCarroPorPlaca);

// ---------- Dados ----------
async function loadRegistros(){
  const { data, error } = await supabaseClient
    .from("historico")
    .select("id, data, km, servicos, observacao, carros(modelo, placa, clientes(nome, cpf))")
    .order("data", { ascending: false });

  if(error){
    console.error(error);
    return;
  }
  registros = data;
  render();
}

function subscribeRealtime(){
  if(realtimeChannel) return;
  realtimeChannel = supabaseClient
    .channel("historico_changes")
    .on("postgres_changes", { event: "*", schema: "public", table: "historico" }, () => loadRegistros())
    .subscribe();
}

function formatDate(value){
  if(!value) return "";
  const [y,m,d] = value.split("-");
  return `${d}/${m}/${y}`;
}

function render(){
  const zone = $("lista");
  if(!registros.length){
    zone.innerHTML = '<div class="empty">Nenhum lançamento ainda</div>';
    return;
  }
  zone.innerHTML = registros.map(r => `
    <div class="list-item">
      <div class="top">
        <span class="cliente">${escapeHtml(r.carros.clientes.nome)} — ${escapeHtml(r.carros.modelo)} (${escapeHtml(r.carros.placa)})</span>
        <span class="meta">📅 ${formatDate(r.data)} · ${r.km} km</span>
      </div>
      <div class="meta">CPF: ${escapeHtml(r.carros.clientes.cpf)}</div>
      <div class="servicos">
        ${r.servicos.map(s => `<span class="badge">${escapeHtml(s)}</span>`).join("")}
      </div>
      ${r.observacao ? `<div class="hint" style="margin-top:8px">📝 ${escapeHtml(r.observacao)}</div>` : ""}
      <div style="margin-top:8px;display:flex;gap:14px">
        <button class="delete-link" style="color:#4b5565" onclick="editar('${r.id}')">Editar</button>
        <button class="delete-link" onclick="excluir('${r.id}')">Excluir</button>
      </div>
    </div>
  `).join("");
}

async function editar(id){
  const r = registros.find(x => x.id === id);
  if(!r) return;

  $("registroId").value = r.id;
  $("placa").value = r.carros.placa;
  await buscarCarroPorPlaca();
  $("data").value = r.data;
  $("km").value = r.km;

  SERVICOS_PADRAO.forEach((s, i) => {
    $(`serv_${i}`).checked = r.servicos.includes(s);
  });
  const extras = r.servicos.filter(s => !SERVICOS_PADRAO.includes(s));
  $("outros").value = extras.join(", ");
  $("observacao").value = r.observacao || "";

  $("submitBtn").textContent = "Salvar alteração";
  $("cancelEditBtn").style.display = "block";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function cancelarEdicao(){
  $("form").reset();
  $("registroId").value = "";
  $("carroId").value = "";
  $("carroInfo").classList.add("hidden");
  $("placaError").textContent = "";
  $("formError").textContent = "";
  carroEncontradoPlaca = null;
  $("submitBtn").textContent = "Salvar lançamento";
  $("cancelEditBtn").style.display = "none";
}

async function excluir(id){
  if(confirm("Excluir este lançamento?")){
    const { error } = await supabaseClient.from("historico").delete().eq("id", id);
    if(error){
      console.error(error);
      alert("Não foi possível excluir. Tente novamente.");
      return;
    }
    await loadRegistros();
  }
}

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  $("formError").textContent = "";

  if(!$("carroId").value){
    $("formError").textContent = "Busque um carro válido pela placa antes de salvar.";
    return;
  }

  const servicosMarcados = SERVICOS_PADRAO.filter((s, i) => $(`serv_${i}`).checked);
  const outros = $("outros").value.trim();
  if(outros) servicosMarcados.push(outros);

  if(!servicosMarcados.length){
    alert("Marque pelo menos um serviço realizado, ou descreva no campo 'Outro'.");
    return;
  }

  const dados = {
    carro_id: $("carroId").value,
    data: $("data").value,
    km: $("km").value,
    servicos: servicosMarcados,
    observacao: $("observacao").value.trim() || null
  };

  const idEmEdicao = $("registroId").value;
  let error;
  if(idEmEdicao){
    ({ error } = await supabaseClient.from("historico").update(dados).eq("id", idEmEdicao));
  }else{
    ({ error } = await supabaseClient.from("historico").insert([dados]));
  }

  if(error){
    console.error(error);
    $("formError").textContent = "Não foi possível salvar. Tente novamente.";
    return;
  }

  await atualizarPrevisoes($("carroId").value, servicosMarcados, dados.data, dados.km);

  await loadRegistros();
  cancelarEdicao();
});

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

renderServiceOptions();
initAuth();
</script>
</body>
</html>
